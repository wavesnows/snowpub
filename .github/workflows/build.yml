name: Build installers

on:
  push:
    branches: ['codex/fix-sidebar-tree-refresh']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-latest
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regression tests
        run: node --test tests/component-registration.test.cjs tests/file-tree-render.test.cjs tests/menu-performance.test.cjs tests/tree-view-sync.test.cjs
      - run: npx vue-tsc --noEmit
      - run: npx vite build
      - name: Rebuild native modules for target architecture
        run: npx electron-builder install-app-deps --arch ${{ matrix.arch }}
      - name: Package installers
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.exe
          if-no-files-found: error
