name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Build into a draft; publish only after every installer has uploaded.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        run: gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --draft --notes-file docs/release-notes-v1.0.2.md --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── macOS：arm64（Apple Silicon）+ x64（Intel）──
  build-mac:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx electron-builder install-app-deps

      - name: Check types
        run: npx vue-tsc --noEmit

      - name: Build renderer & main process
        run: npx vite build

      - name: Package & publish (arm64 + x64)
        run: npx electron-builder --mac --x64 --arm64 --publish always -c.npmRebuild=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Windows：x64 ──
  build-win:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx electron-builder install-app-deps

      - name: Check types
        run: npx vue-tsc --noEmit

      - name: Build renderer & main process
        run: npx vite build

      - name: Package & publish (x64)
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed release
        run: gh release edit ${{ github.ref_name }} --draft=false --latest --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
